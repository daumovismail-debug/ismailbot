<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vant2 Web</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Vant2</h1>
      <div id="auth">
        <input id="phone" placeholder="+1 555 111 22 33" />
        <button id="sendOtp">Send OTP</button>
        <input id="otp" placeholder="OTP" />
        <button id="verifyOtp">Verify</button>
      </div>
      <div id="chats"></div>
    </aside>
    <main class="chat">
      <header id="chatTitle">Выбери чат</header>
      <section id="messages"></section>
      <footer>
        <input id="msgInput" placeholder="Сообщение" />
        <button id="sendMsg">Send</button>
      </footer>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
